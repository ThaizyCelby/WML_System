{# Usage: {% include "staff/_transition_button.html" with to_status="..." label="..." style="..." %} #}
<form method="post" action="{% url 'staff_applications_list' %}{{ application.id }}/transition/" class="contents">
  {% csrf_token %}
  <input type="hidden" name="to_status" value="{{ to_status }}">
  <input type="hidden" name="notes" value="{{ label }}">
  <button type="submit"
    class="w-full rounded-lg px-4 py-2.5 text-sm font-semibold
      {% if style == 'success' %}bg-emerald-700 text-white hover:bg-emerald-800
      {% elif style == 'danger' %}bg-rose-700 text-white hover:bg-rose-800
      {% else %}bg-brand-900 text-white hover:bg-brand-800{% endif %}">
    {{ label }}
  </button>
</form>
