{% load static %}<!doctype html>
<html lang="en" class="h-full" x-data="{ dark: localStorage.getItem('wethu-theme') === 'dark' }" :class="{ 'dark': dark }" x-init="$watch('dark', v => localStorage.setItem('wethu-theme', v ? 'dark' : 'light'))">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="description" content="{% block meta_description %}{{ SITE_DESCRIPTION }}{% endblock %}">
  <meta name="csrf-token" content="{{ csrf_token }}">
  <title>{% block title %}{{ SITE_NAME }}{% endblock %}</title>

  <link rel="icon" href="{% static 'img/favicon.svg' %}" type="image/svg+xml">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&family=JetBrains+Mono:wght@400;600&display=swap" rel="stylesheet">

  <script src="https://cdn.tailwindcss.com?plugins=forms,typography,aspect-ratio"></script>
  <script>
    tailwind.config = {
      darkMode: 'class',
      theme: {
        extend: {
          fontFamily: {
            sans: ['Inter', 'ui-sans-serif', 'system-ui'],
            mono: ['JetBrains Mono', 'ui-monospace'],
          },
          colors: {
            brand: {
              50:  '#eff8ff', 100: '#d9efff', 200: '#bce4ff',
              300: '#8ed2ff', 400: '#59b7ff', 500: '#3397ff',
              600: '#1c78f5', 700: '#1561e1', 800: '#1850b6',
              900: '#0e2c5c', 950: '#0a1f3e',
            },
            accent: {
              50:  '#effcf9', 100: '#c9f7ee', 200: '#96edde',
              300: '#5cddc9', 400: '#2ec4b0', 500: '#16a897',
              600: '#0e877c', 700: '#116c65', 800: '#135651',
              900: '#134744',
            },
          },
        },
      },
    };
  </script>
  <link rel="stylesheet" href="{% static 'css/wethu.css' %}">
  <script defer src="https://cdn.jsdelivr.net/npm/alpinejs@3.14.1/dist/cdn.min.js"></script>
  <script src="https://unpkg.com/htmx.org@2.0.2"></script>
  <script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.3/dist/chart.umd.min.js"></script>

  {% block extra_head %}{% endblock %}
</head>
<body class="h-full font-sans bg-slate-50 text-slate-900 dark:bg-slate-950 dark:text-slate-100 antialiased">

  {% block body %}{% endblock %}

  <div id="htmx-toast" class="fixed bottom-4 right-4 z-50 space-y-2" aria-live="polite"></div>
  <div id="htmx-modal" class="hidden fixed inset-0 z-40 bg-black/50 backdrop-blur-sm"></div>

  <script src="{% static 'js/wethu.js' %}" defer></script>
  {% block extra_js %}{% endblock %}
</body>
</html>
