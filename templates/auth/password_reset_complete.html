{% extends "base.html" %}
{% block title %}Password reset complete — {{ SITE_NAME }}{% endblock %}
{% block body %}
<div class="min-h-full flex items-center justify-center p-6">
  <div class="w-full max-w-md text-center">
    <a href="/" class="inline-flex items-center gap-2 font-bold text-brand-900 dark:text-white mb-8">
      {% include "components/logo.html" %}<span>{{ SITE_NAME }}</span>
    </a>
    <h1 class="text-2xl font-bold text-brand-950 dark:text-white">Password reset complete</h1>
    <p class="mt-2 text-sm text-slate-500 dark:text-slate-400">
      Your password has been updated. You can now sign in with your new password.
    </p>
    <a href="/login/" class="mt-6 inline-block rounded-lg bg-brand-900 px-5 py-2.5 text-sm font-semibold text-white hover:bg-brand-800">
      Sign in
    </a>
  </div>
</div>
{% endblock %}
